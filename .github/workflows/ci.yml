name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run regression suite
        run: swift run command-guard-tests
      - name: Build release binary
        run: swift build -c release
      - name: Run safe direct canaries
        run: swift scripts/run-canaries.swift --binary .build/release/codex-command-guard
